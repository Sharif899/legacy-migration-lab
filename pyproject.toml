[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-migration-lab"
version = "1.0.0"
description = "End-to-end legacy codebase migration lab: a Python 2-style payments ledger migrated to modern Python 3.12, with behavioural equivalence proof, differential testing and an AI migration evaluator."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
